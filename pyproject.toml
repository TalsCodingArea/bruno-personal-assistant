[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finance-agent"
version = "0.1.0"
description = "A LangGraph-based personal finance agent with Notion as its source of truth."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.2,<2",
    "langgraph>=1.2,<2",
    "notion-client>=3.1,<4",
    "pydantic-settings>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "mypy>=1.18,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
