services:
  bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Jerusalem
    volumes:
      # Gitignored, host-only data — not baked into the image (see .dockerignore)
      - ./budget_data:/app/budget_data
      - ./data:/app/data
      - ./notion_config:/app/notion_config
      - ./personal_notes_examples:/app/personal_notes_examples
      - ./resume_data:/app/resume_data
    restart: unless-stopped
